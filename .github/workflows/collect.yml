name: 뉴스 자동 수집

on:
  schedule:
    - cron: '0 * * * *'    # 매 시간 정각 UTC
    - cron: '30 * * * *'   # 매 시간 30분 UTC
  workflow_dispatch:        # 수동 실행 버튼
  push:
    branches: [ main ]      # 코드 push할 때도 실행

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 저장소에 쓰기 권한 (활성 상태 유지)
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 뉴스 수집 실행
        run: python collect_news.py

      - name: 저장소 활성 상태 유지 (빈 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep alive $(date '+%Y-%m-%d %H:%M')"
          git push
