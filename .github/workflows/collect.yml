name: 뉴스 자동 수집

on:
  schedule:
    - cron: '0 * * * *'    # 매 시간 정각 UTC
    - cron: '30 * * * *'   # 매 시간 30분 UTC
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 뉴스 수집 실행
        run: python collect_news.py
